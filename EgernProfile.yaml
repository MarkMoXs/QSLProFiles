      value: reject
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Google.lsr
      value: Global
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/MarkMoXs/QSLProFiles/refs/heads/TestFiles/Loon/rules/Instagram/Instagram.list
      value: Global
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/LoveMyself546/ACL4SSR/refs/heads/master/Clash/ProxyGFWlist.list
      value: Global
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
      value: China
      disabled: false
  - domain_wildcard:
      match: '*'
      value: China
      disabled: false
