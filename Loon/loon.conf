# 9️⃣ >>>>>>>>>>>>>>> 🚥 本地分流 🚥 <<<<<<<<<<<<<<
# 本地分流规则部分书写在下面
# 格式为 规则类型,域名(部分类型可省略),策略
#
# 目前支持的类型有
# DOMAIN         基于域名完整匹配
# DOMAIN-SUFFIX  基于域名后缀
# DOMAIN-KEYWORD 基于域名关键字
# USER-AGENT     基于用户代理串
# URL-REGEX      基于 URL 正则
# IP-CIDR        基于请求 IPv4范围
# GEOIP          基于 IP 定位国家编码
# FINAL          兜底策略，所有策略都未匹配上时使用
[Rule]

# 头条广告
DOMAIN,api-access.pangolin-sdk-toutiao.com,REJECT
DOMAIN,sf3-fe-tos.pglstatp-toutiao.com,REJECT
DOMAIN-KEYWORD,toutiao,REJECT.
# 桔子云
DOMAIN-SUFFIX,juzi52.net,DIRECT.
DOMAIN-SUFFIX,su.juzicloud.vip,Google
# 果核剥壳
DOMAIN-SUFFIX,ghxi.com,DIRECT
# 农行防代理检测
DOMAIN,msmp.abchina.com.cn,REJECT
# 抖音
DOMAIN-SUFFIX,ndcppx.com,DIRECT
DOMAIN-SUFFIX,ndcpp.com,DIRECT
# DuetDisplay
DOMAIN-SUFFIX,duetsocket.com,香港优选
DOMAIN-SUFFIX,duetdisplay.com,香港优选
DOMAIN-SUFFIX,duetpanel.com,香港优选

GEOIP,CN,DIRECT
FINAL,Global




