# 本地规则部分书写在下面
# 格式为 规则类型,域名(部分类型可省略),策略
#
# 目前支持的类型有
# DOMAIN         基于域名完整匹配
# DOMAIN-SUFFIX  基于域名后缀
# DOMAIN-KEYWORD 基于域名关键字
# USER-AGENT     基于用户代理串
# URL-REGEX      基于 URL 正则
# IP-CIDR        基于请求 IPv4范围
# GEOIP          基于 IP 定位国家编码
# FINAL          兜底策略，所有策略都未匹配上时使用
